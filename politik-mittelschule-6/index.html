<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const theme = localStorage.getItem("politik_ms6_theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <title>Politik und Gesellschaft 6 Mittelschule · ZAM Academy</title>
    <meta name="description" content="Politik und Gesellschaft für Mittelschule 6 in Bayern. Entdecke Burgen, Klöster, die Ständegesellschaft und heutige Freiheiten." />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="header">
        <a href="#" id="home" class="brand"><span class="brand-mark" aria-hidden="true">GPG</span><span>Politik und Gesellschaft <small>ZAM Academy · Mittelschule Bayern · Klasse 6</small></span></a>
        <nav aria-label="Hauptnavigation"><button type="button" data-view="path">Lernpfad</button><button type="button" data-view="lesson">Lektion</button><button type="button" data-view="reference">Nachschlagen</button></nav>
        <div class="header-actions"><button type="button" id="zam" class="button accent">In ZAM festigen</button><button type="button" id="theme" class="icon-button" aria-label="Farbschema umschalten">◐</button></div>
      </header>
      <div class="progress-strip"><span id="progress-label"></span><progress id="progress" max="100" value="0" aria-label="Fortschritt der Kernlektionen"></progress></div>
      <main id="main" tabindex="-1"></main>
      <footer>
        <a href="https://academy.zam-os.org/" class="zam-home-link">← ZAM Academy <span class="zam-version" title="Noch nicht von einer Lehrkraft geprüft">· Version&nbsp;0.0 · Lehrkraftprüfung&nbsp;offen</span></a>
        <span>Nach <a href="https://www.lehrplanplus.bayern.de/fachlehrplan/mittelschule/6/gpg/regelklasse" target="_blank" rel="noopener">LehrplanPLUS Bayern</a> · Jahrgangsstufe 6</span><span>Keine Konten und kein Tracking. Fortschritt und eigene Texte bleiben in diesem Browser. <a href="https://github.com/zam-os/zam-academy" target="_blank" rel="noopener">Quelltext</a></span><span id="storage-note" role="status"></span>
      </footer>
    </div>
    <div id="toast-stack" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const theme = localStorage.getItem("biologie_gy5_theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <title>Biologie 5 Gymnasium · ZAM Academy</title>
    <meta name="description" content="Biologie 5 Gymnasium Bayern (Natur und Technik, Schwerpunkt Biologie): 44 Lektionen zu Erkenntnisweg und Mikroskop, Zellen, Sinnen, Skelett und Muskeln, Ernährung, Atmung und Kreislauf, Pubertät, Blüten und Ökosystem Grünland." />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="header">
        <a href="#" id="home" class="brand"><span class="brand-mark" aria-hidden="true">Bio</span><span>Biologie 5 <small>ZAM Academy · Gymnasium Bayern</small></span></a>
        <nav aria-label="Hauptnavigation"><button type="button" data-view="path">Lernpfad</button><button type="button" data-view="lesson">Lektion</button><button type="button" data-view="reference">Nachschlagen</button></nav>
        <div class="header-actions"><button type="button" id="zam" class="button accent">In ZAM festigen</button><button type="button" id="theme" class="icon-button" aria-label="Farbschema umschalten">◐</button></div>
      </header>
      <div class="progress-strip"><span id="progress-label"></span><progress id="progress" max="100" value="0" aria-label="Fortschritt der Kernlektionen"></progress></div>
      <main id="main" tabindex="-1"></main>
      <footer><span>Nach <a href="https://www.lehrplanplus.bayern.de/fachlehrplan/gymnasium/5/nt_gym" target="_blank" rel="noopener">LehrplanPLUS Bayern</a> · Natur und Technik 5, Schwerpunkt Biologie</span><span>Keine Konten und kein Tracking. Fortschritt und eigene Texte bleiben in diesem Browser. <a href="https://github.com/zam-os/zam-academy" target="_blank" rel="noopener">Quelltext</a></span><span id="storage-note" role="status"></span></footer>
    </div>
    <div id="toast-stack" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
    <a href="https://academy.zam-os.org/" class="zam-home-link">← ZAM Academy</a>
  </body>
</html>

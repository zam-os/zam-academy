name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [uml]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Offline zip
        run: node scripts/build-release-zip.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: zam-academy-${{ matrix.app }}-offline
          path: ${{ matrix.app }}/release/*.zip
          if-no-files-found: error

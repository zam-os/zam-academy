name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [uml, physik-realschule-9, sql]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Offline zip
        run: node scripts/build-release-zip.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: zam-academy-${{ matrix.app }}-offline
          path: ${{ matrix.app }}/release/*.zip
          if-no-files-found: error

  cells:
    name: cells
    runs-on: ubuntu-latest
    env:
      # Pinned exactly; raise it when a cell needs a newer tile format.
      ZAM_CORE_VERSION: 0.54.0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Install zam-core
        run: |
          mkdir -p "$RUNNER_TEMP/zam-core"
          cd "$RUNNER_TEMP/zam-core"
          npm init -y >/dev/null
          npm i --no-audit --no-fund "zam-core@$ZAM_CORE_VERSION"
      - name: Install every cell into a throw-away library
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node scripts/validate-cells.mjs
      - name: Build the catalog
        run: node scripts/build-catalog.mjs "$RUNNER_TEMP/catalog.json"

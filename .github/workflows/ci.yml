name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Browser storage in UI tests must come from jsdom, not the Node host.
  NODE_OPTIONS: --no-experimental-webstorage

jobs:
  # Tests only what changed (scripts/changed-apps.mjs): a package is a
  # top-level folder with a package.json and is tested when a file in it
  # changed; every package when the jobs above `cells` changed or the base
  # commit is unknown. The cells job always runs.
  changes:
    name: changed packages
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.select.outputs.apps }}
    env:
      BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - run: node --test scripts/changed-apps.test.mjs
      - id: select
        run: |
          apps=$(node scripts/changed-apps.mjs "$BASE")
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "Testing: $apps" >> "$GITHUB_STEP_SUMMARY"

  app:
    name: ${{ matrix.app }}
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Offline zip
        run: node scripts/build-release-zip.mjs
      - name: Check Grade 5 geography curriculum and source snapshots
        if: matrix.app == 'geographie-realschule-5'
        run: node scripts/verify-content.mjs
      - name: Check self-contained offline bundles
        if: matrix.app == 'deutsch-gymnasium-5' || matrix.app == 'geographie-gymnasium-5' || matrix.app == 'nt-mittelschule-5' || matrix.app == 'gpg-mittelschule-5' || matrix.app == 'biologie-realschule-6' || matrix.app == 'geographie-realschule-5' || matrix.app == 'deutsch-mittelschule-5' || matrix.app == 'deutsch-mittelschule-6' || matrix.app == 'deutsch-mittelschule-7' || matrix.app == 'deutsch-mittelschule-8' || matrix.app == 'mathematik-mittelschule-5' || matrix.app == 'mathematik-mittelschule-6' || matrix.app == 'mathematik-mittelschule-9' || matrix.app == 'mathematik-mittelschule-10' || matrix.app == 'mathematik-grundschule-4' || matrix.app == 'deutsch-grundschule-4' || matrix.app == 'hsu-grundschule-4' || matrix.app == 'geographie-realschule-8' || matrix.app == 'chemie-realschule-8' || matrix.app == 'deutsch-realschule-10' || matrix.app == 'englisch-realschule-5' || matrix.app == 'englisch-realschule-10' || matrix.app == 'politik-realschule-10' || matrix.app == 'biologie-realschule-5' || matrix.app == 'biologie-realschule-8' || matrix.app == 'informatik-realschule-8' || matrix.app == 'deutsch-realschule-5' || matrix.app == 'deutsch-realschule-8' || matrix.app == 'geschichte-realschule-8' || matrix.app == 'englisch-realschule-8' || matrix.app == 'franzoesisch-realschule-8' || matrix.app == 'franzoesisch-gymnasium-5'
        run: node scripts/verify-release.mjs
      - name: Check verbatim Grade 5 Gymnasium German curriculum coverage
        if: matrix.app == 'deutsch-gymnasium-5'
        run: node scripts/check-curriculum.mjs
      - name: Check verbatim Geographie 5 Gymnasium curriculum coverage
        if: matrix.app == 'geographie-gymnasium-5'
        run: node scripts/check-curriculum.mjs
      - name: Check verbatim Mittelschule curriculum coverage
        if: matrix.app == 'nt-mittelschule-5' || matrix.app == 'gpg-mittelschule-5' || matrix.app == 'deutsch-mittelschule-5' || matrix.app == 'deutsch-mittelschule-6' || matrix.app == 'deutsch-mittelschule-7' || matrix.app == 'deutsch-mittelschule-8' || matrix.app == 'mathematik-mittelschule-5' || matrix.app == 'mathematik-mittelschule-6' || matrix.app == 'mathematik-mittelschule-9' || matrix.app == 'mathematik-mittelschule-10'
        run: node scripts/check-curriculum.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: zam-academy-${{ matrix.app }}-offline
          path: ${{ matrix.app }}/release/*.zip
          if-no-files-found: error

  cells:
    name: cells
    runs-on: ubuntu-latest
    env:
      # Pinned exactly; raise it when a cell needs a newer tile format.
      ZAM_CORE_VERSION: 0.54.0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Test catalog publication safeguards and the atlas registry
        run: node --test scripts/build-catalog.test.mjs scripts/academy-registry.test.mjs
      - name: Install zam-core
        run: |
          mkdir -p "$RUNNER_TEMP/zam-core"
          cd "$RUNNER_TEMP/zam-core"
          npm init -y >/dev/null
          npm i --no-audit --no-fund "zam-core@$ZAM_CORE_VERSION"
      - name: Install every cell into a throw-away library
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node scripts/validate-cells.mjs
      - name: Preserve Chemie histories and refuse automatic merges
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node chemie-realschule-9/scripts/validate-migration.mjs
      - name: Preserve Geschichte histories and refuse automatic merges
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node geschichte-realschule-9/scripts/validate-migration.mjs
      - name: Preserve Geographie histories and refuse automatic merges
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node geographie-realschule-9/scripts/validate-migration.mjs
      - name: Preserve Biologie histories and refuse automatic merges
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node biologie-realschule-10/scripts/validate-migration.mjs
      - name: Move the approved Grade 11 introductory biology history and refuse automatic merges
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node biologie-gymnasium-11/scripts/validate-migration.mjs
      - name: Preserve Physik 10 histories and refuse automatic merges
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node physik-realschule-10/scripts/validate-migration.mjs
      - name: Preserve IT histories across both successor cells
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node scripts/validate-it-migration.mjs
      - name: Preserve BwR 9 histories and refuse automatic merges
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node bwr-realschule-9/scripts/validate-migration.mjs
      - name: Preserve Wirtschaft und Recht 9 histories and refuse automatic merges
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node wirtschaft-recht-realschule-9/scripts/validate-migration.mjs
      - name: Preserve Mathematik 10 histories and refuse automatic merges
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node mathematik-realschule-10/scripts/validate-migration.mjs
      - name: Preserve Mathematik 5 histories while adding fresh cards
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node mathematik-realschule-5/scripts/validate-migration.mjs
      - name: Preserve Mathematik 5 Gymnasium histories while adding fresh cards
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node mathematik-gymnasium-5/scripts/validate-migration.mjs
      - name: Move the approved Mathematik 13 Gymnasium histories, keep the C cards active and refuse automatic merges
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node mathematik-gymnasium-13/scripts/validate-migration.mjs
      - name: Preserve Mathematik 6 Gymnasium histories while adding fresh cards
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node mathematik-gymnasium-6/scripts/validate-migration.mjs
      - name: Move the approved Mathematik 7 Gymnasium histories, keep the C cards active and refuse automatic merges
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node mathematik-gymnasium-7/scripts/validate-cell.mjs
      - name: Move the approved Mathematik 11 Gymnasium history, keep the C cards active and refuse automatic merges
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node mathematik-gymnasium-11/scripts/validate-migration.mjs
      - name: Move the approved Mathematik 12 Gymnasium histories in temporary libraries
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node mathematik-gymnasium-12/scripts/validate-migration.mjs
      - name: Move the approved Physik 11 Gymnasium histories in temporary libraries
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node physik-gymnasium-11/scripts/validate-migration.mjs
      - name: Preserve Mathematik 6 histories while adding fresh cards
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node mathematik-realschule-6/scripts/validate-migration.mjs
      - name: Preserve Mathematik 7 histories while adding fresh cards
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node mathematik-realschule-7/scripts/validate-migration.mjs
      - name: Preserve Deutsch 9 histories of the retired cards
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node deutsch-realschule-9/scripts/validate-migration.mjs
      - name: Preserve Mathematik 8 histories and refuse automatic merges
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node mathematik-realschule-8/scripts/validate-migration.mjs
      - name: Preserve Physik 8 histories and refuse automatic merges
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node physik-realschule-8/scripts/validate-migration.mjs
      - name: Preserve Englisch 9 histories and rehearse the proposed mapping in temporary libraries
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node englisch-realschule-9/scripts/validate-migration.mjs
      - name: Preserve Französisch 9 histories and refuse automatic merges
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node franzoesisch-realschule-9/scripts/validate-migration.mjs
      - name: Preserve existing IT histories when adding Informatik 10
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node informatik-realschule-10/scripts/validate-cell.mjs
      - name: Move the seven approved Chemie 10 histories in temporary libraries
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node chemie-realschule-10/scripts/validate-migration.mjs
      - name: Preserve Deutsch 10 histories when adding the new practice package
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node deutsch-realschule-10/scripts/validate-cell.mjs
      - name: Move the two approved Geschichte 10 histories and retire two old cards in temporary libraries
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node geschichte-realschule-10/scripts/validate-migration.mjs
      - name: Move the two approved BwR 10 histories and retire two old cards in temporary libraries
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node bwr-realschule-10/scripts/validate-migration.mjs
      - name: Preserve existing histories when adding Politik und Gesellschaft 10
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node politik-realschule-10/scripts/validate-cell.mjs
      - name: Move the approved Biologie 6 Realschule histories, keep the C cards active and refuse automatic merges
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node biologie-realschule-6/scripts/validate-cell.mjs
      - name: Preserve existing histories when adding Biologie 8
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node biologie-realschule-8/scripts/validate-cell.mjs
      - name: Preserve existing Geographie histories when adding Geographie 8
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node geographie-realschule-8/scripts/validate-cell.mjs
      - name: Preserve Deutsch 8 histories when adding the new practice package
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node deutsch-realschule-8/scripts/validate-cell.mjs
      - name: Verify Grade 5 German histories and rehearse the mapping in temporary libraries
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node deutsch-realschule-5/scripts/validate-migration.mjs
      - name: Preserve existing histories when adding History 8
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node geschichte-realschule-8/scripts/validate-cell.mjs
      - name: Preserve existing histories when adding French 8
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node franzoesisch-realschule-8/scripts/validate-cell.mjs
      - name: Verify Grade 5 Gymnasium French enrolment and recall
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node franzoesisch-gymnasium-5/scripts/validate-cell.mjs
      - name: Verify Grade 5 Gymnasium German enrolment and preserve legacy evidence
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node deutsch-gymnasium-5/scripts/validate-cell.mjs
      - name: Build the catalog (requires explicit mapping approval)
        run: node scripts/build-catalog.mjs "$RUNNER_TEMP/catalog.json"
      - name: Preserve Englisch 10 histories when adding fresh practice cards
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node englisch-realschule-10/scripts/validate-cell.mjs
      - name: Move the eight approved Chemie 8 histories and retire eight old cards in temporary libraries
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node chemie-realschule-8/scripts/validate-migration.mjs
      - name: Move approved Informatik 6–8 histories to Informatik 8 and retire the C cards in temporary libraries
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node informatik-realschule-8/scripts/validate-migration.mjs
      - name: Preserve Englisch 8 histories and rehearse the proposed mapping in temporary libraries
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node englisch-realschule-8/scripts/validate-cell.mjs
      - name: Preserve Englisch 5 histories and rehearse the proposed mapping in temporary libraries
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node englisch-realschule-5/scripts/validate-migration.mjs
      - name: Verify the Grade 4 starter enrolment and recall path
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node mathematik-grundschule-4/scripts/validate-cell.mjs
      - name: Enrol and recall the Grade 4 German draft without touching other histories
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node deutsch-grundschule-4/scripts/validate-cell.mjs
      - name: Verify the Grade 4 HSU enrolment and recall path
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node hsu-grundschule-4/scripts/validate-cell.mjs
      - name: Preserve existing histories when adding Deutsch 7 Mittelschule
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node deutsch-mittelschule-7/scripts/validate-cell.mjs
      - name: Preserve existing histories when adding Deutsch 8 Mittelschule
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node deutsch-mittelschule-8/scripts/validate-cell.mjs
      - name: Move approved Biologie 5 histories to Biologie 5 Realschule in temporary libraries
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node biologie-realschule-5/scripts/validate-migration.mjs
      - name: Move the approved Geographie 5 Gymnasium histories and refuse automatic merges
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node geographie-gymnasium-5/scripts/validate-migration.mjs
      - name: Install and enrol Geschichte/Politik/Geographie 5 Mittelschule idempotently
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node gpg-mittelschule-5/scripts/validate-cell.mjs
      - name: Install and enrol Natur und Technik 5 Mittelschule idempotently
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node nt-mittelschule-5/scripts/validate-cell.mjs

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [uml, physik-realschule-9, sql, mathematik-realschule-7, mathematik-realschule-9, chemie-realschule-9, geschichte-realschule-9, geographie-realschule-9, biologie-realschule-10, physik-realschule-10, algorithmen, datennetze, bwr-realschule-9, wirtschaft-recht-realschule-9, mathematik-realschule-10]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Offline zip
        run: node scripts/build-release-zip.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: zam-academy-${{ matrix.app }}-offline
          path: ${{ matrix.app }}/release/*.zip
          if-no-files-found: error

  cells:
    name: cells
    runs-on: ubuntu-latest
    env:
      # Pinned exactly; raise it when a cell needs a newer tile format.
      ZAM_CORE_VERSION: 0.54.0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Test catalog publication safeguards and the atlas registry
        run: node --test scripts/build-catalog.test.mjs scripts/academy-registry.test.mjs
      - name: Install zam-core
        run: |
          mkdir -p "$RUNNER_TEMP/zam-core"
          cd "$RUNNER_TEMP/zam-core"
          npm init -y >/dev/null
          npm i --no-audit --no-fund "zam-core@$ZAM_CORE_VERSION"
      - name: Install every cell into a throw-away library
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node scripts/validate-cells.mjs
      - name: Preserve Chemie histories and refuse automatic merges
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node chemie-realschule-9/scripts/validate-migration.mjs
      - name: Preserve Geschichte histories and refuse automatic merges
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node geschichte-realschule-9/scripts/validate-migration.mjs
      - name: Preserve Geographie histories and refuse automatic merges
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node geographie-realschule-9/scripts/validate-migration.mjs
      - name: Preserve Biologie histories and refuse automatic merges
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node biologie-realschule-10/scripts/validate-migration.mjs
      - name: Preserve Physik 10 histories and refuse automatic merges
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node physik-realschule-10/scripts/validate-migration.mjs
      - name: Preserve IT histories across both successor cells
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node scripts/validate-it-migration.mjs
      - name: Preserve BwR 9 histories and refuse automatic merges
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node bwr-realschule-9/scripts/validate-migration.mjs
      - name: Preserve Wirtschaft und Recht 9 histories and refuse automatic merges
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node wirtschaft-recht-realschule-9/scripts/validate-migration.mjs
      - name: Preserve Mathematik 10 histories and refuse automatic merges
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node mathematik-realschule-10/scripts/validate-migration.mjs
      - name: Preserve Mathematik 7 histories while adding fresh cards
        run: ZAM_CORE="file://$RUNNER_TEMP/zam-core/node_modules/zam-core/dist/index.js" node mathematik-realschule-7/scripts/validate-migration.mjs
      - name: Build the catalog (requires explicit mapping approval)
        run: node scripts/build-catalog.mjs "$RUNNER_TEMP/catalog.json"

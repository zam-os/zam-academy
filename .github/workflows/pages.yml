name: Pages

# Builds every app and publishes https://academy.zam-os.org/ (custom domain
# set in Settings → Pages; source: GitHub Actions). It runs no test suites:
# CI tests the changed packages on the pull request and again on main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Check mapping approvals before publishing
        run: node scripts/build-catalog.mjs "$RUNNER_TEMP/catalog.json"
      - name: Build site
        run: |
          mkdir -p site
          cp index.html academy.json site/
          for app in physik-gymnasium-7 nt-gymnasium-7 informatik-mittelschule-6 deutsch-gymnasium-6 geschichte-gymnasium-6 englisch-realschule-6 englisch-gymnasium-6 physik-realschule-7 informatik-gymnasium-6 biologie-gymnasium-6 englisch-gymnasium-5 deutsch-gymnasium-5 englisch-mittelschule-5 englisch-mittelschule-6 franzoesisch-gymnasium-5 franzoesisch-gymnasium-6 geographie-gymnasium-5 biologie-gymnasium-5 nt-mittelschule-5 nt-mittelschule-6 nt-mittelschule-7 gpg-mittelschule-5 politik-mittelschule-6 politik-mittelschule-7 deutsch-mittelschule-5 deutsch-mittelschule-6 deutsch-mittelschule-7 deutsch-mittelschule-8 mathematik-mittelschule-7 mathematik-mittelschule-8 mathematik-mittelschule-9 mathematik-mittelschule-10 mathematik-mittelschule-6 mathematik-mittelschule-5 mathematik-grundschule-4 deutsch-grundschule-4 hsu-grundschule-4 uml physik-realschule-9 sql mathematik-gymnasium-5 mathematik-gymnasium-6 mathematik-gymnasium-7 mathematik-gymnasium-11 mathematik-gymnasium-12 mathematik-gymnasium-13 physik-gymnasium-11 mathematik-realschule-5 mathematik-realschule-6 mathematik-realschule-7 mathematik-realschule-8 mathematik-realschule-9 chemie-realschule-8 chemie-realschule-9 geschichte-realschule-9 geographie-realschule-5 geographie-realschule-6 geographie-realschule-9 geographie-realschule-8 biologie-realschule-6 biologie-realschule-7 biologie-realschule-10 biologie-gymnasium-11 physik-realschule-10 algorithmen datennetze bwr-realschule-9 wirtschaft-recht-realschule-9 mathematik-realschule-10 deutsch-realschule-9 physik-realschule-8 deutsch-realschule-5 deutsch-realschule-6 deutsch-realschule-7 englisch-realschule-5 englisch-realschule-9 franzoesisch-realschule-9 franzoesisch-realschule-10 informatik-realschule-10 chemie-realschule-10 deutsch-realschule-10 geschichte-realschule-10 englisch-realschule-10 bwr-realschule-10 politik-realschule-10 biologie-realschule-5 biologie-realschule-8 informatik-realschule-8 deutsch-realschule-8 geschichte-realschule-8 geschichte-realschule-6 englisch-realschule-8 franzoesisch-realschule-8; do
            node --input-type=module -e 'import { assertPublishedApp } from "./scripts/build-catalog.mjs"; assertPublishedApp(process.argv[1], "published by Pages");' "$app"
            build_script=build
            if [ "$app" = "nt-gymnasium-7" ]; then build_script=build:pages; fi
            (cd "$app" && npm ci && npm run "$build_script")
            mkdir -p "site/$app"
            cp -R "$app/dist/." "site/$app/"
            if [ -f "$app/cell.json" ]; then cp "$app/cell.json" "site/$app/cell.json"; fi
          done
          node scripts/build-catalog.mjs site/catalog.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

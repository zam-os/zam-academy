name: Pages

# Builds every app and publishes https://academy.zam-os.org/ (custom domain
# set in Settings → Pages; source: GitHub Actions).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Check mapping approvals before publishing
        run: node scripts/build-catalog.mjs "$RUNNER_TEMP/catalog.json"
      - name: Build site
        run: |
          mkdir -p site
          cp index.html academy.json site/
          for app in uml physik-realschule-9 sql mathematik-realschule-7 mathematik-realschule-8 mathematik-realschule-9 chemie-realschule-9 geschichte-realschule-9 geographie-realschule-9 biologie-realschule-10 physik-realschule-10 algorithmen datennetze bwr-realschule-9 wirtschaft-recht-realschule-9 mathematik-realschule-10 deutsch-realschule-9 physik-realschule-8 franzoesisch-realschule-9; do
            (cd "$app" && npm ci && npm test && npm run build)
            mkdir -p "site/$app"
            cp -R "$app/dist/." "site/$app/"
            if [ -f "$app/cell.json" ]; then cp "$app/cell.json" "site/$app/cell.json"; fi
          done
          node scripts/build-catalog.mjs site/catalog.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
